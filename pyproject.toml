[project]
name = "clipaudio"
version = "0.1.0"
description = "Extract audio from video URLs across platforms (YouTube, Bilibili, Vimeo, etc.)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["audio", "youtube", "bilibili", "download", "macos", "menu-bar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "certifi>=2024.8.30",
    "yt-dlp>=2025.10.14",
    "imageio-ffmpeg>=0.6.0",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "setuptools<81",
    "pyinstaller>=6.17.0",
]

[project.scripts]
clipaudio-menu = "clipaudio.menubar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
